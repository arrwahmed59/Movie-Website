<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Web</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div id="sidebar">
      <button id="toggleSidebar">☰</button>
      <ul>
        <li>
          <a href="#" class="nav-link text-light" data-category="now_playing"
            >Now Playing</a
          >
        </li>
        <li>
          <a href="#" class="nav-link text-light" data-category="popular"
            >Popular</a
          >
        </li>
        <li>
          <a href="#" class="nav-link text-light" data-category="top_rated"
            >Top Rated</a
          >
        </li>
        <li>
          <a href="#" class="nav-link text-light" data-category="trending"
            >Trending</a
          >
        </li>
        <li>
          <a href="#" class="nav-link text-light" data-category="upcoming"
            >Upcoming</a
          >
        </li>
        <li><a href="#contact" class="nav-link text-light">Contact Us</a></li>
      </ul>
    </div>

    <!-- Main Content -->
    <div id="main-content">
      <nav class="custom-navbar">
        <div class="search-box">
          <input
            id="searchInput"
            type="search"
            placeholder="Search movies..."
          />
          <input
            id="searchWord"
            type="text"
            placeholder="Get movies by word.."
          />
        </div>
      </nav>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="text-center my-5" style="display: none">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Movies Container -->
    <div class="container my-5">
      <div id="movies" class="row g-4"></div>
    </div>

    <!-- Movie Details Modal -->
    <div class="modal fade" id="movieModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="movieTitle"></h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-4">
                <img id="moviePoster" class="img-fluid rounded" alt="" />
              </div>
              <div class="col-md-8">
                <p id="movieOverview"></p>
                <p>
                  <strong>Release Date:</strong> <span id="movieDate"></span>
                </p>
                <p>
                  <strong>Rating:</strong> ⭐ <span id="movieRating"></span>
                </p>
                <p><strong>Language:</strong> <span id="movieLang"></span></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contact Us Section -->
    <div id="contact" class="container-fluid text-light py-5">
      <div class="container">
        <h2 class="text-center mb-4">Contact Us....</h2>
        <form id="contactForm" class="row g-4 justify-content-center">
          <div class="col-md-6 col-lg-4">
            <input
              type="text"
              class="form-control custom-input"
              id="name"
              placeholder="Enter Your Name"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4">
            <input
              type="email"
              class="form-control custom-input"
              id="email"
              placeholder="Enter Your Email"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4">
            <input
              type="tel"
              class="form-control custom-input"
              id="phone"
              placeholder="Enter Phone"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4">
            <input
              type="number"
              class="form-control custom-input"
              id="age"
              placeholder="Enter Age"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4">
            <input
              type="password"
              class="form-control custom-input"
              id="password"
              placeholder="Enter Password"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4">
            <input
              type="password"
              class="form-control custom-input"
              id="confirmPassword"
              placeholder="Enter RePassword"
              required
            />
          </div>
          <div class="col-md-6 col-lg-4 text-center">
            <button type="submit" class="btn btn-outline-danger px-4">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
